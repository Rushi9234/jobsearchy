services:
  - type: web
    name: jobsearchy
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn web_portal:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 2 --worker-class gthread"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
