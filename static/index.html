        <div className="empty"><div className="empty-ic" style={{fontSize:36,opacity:.25}}><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="12" y2="16"/></svg></div><div className="empty-t">{entries.length===0?'No applications yet':'Nothing in this stage'}</div><div className="empty-s">{entries.length===0?'Click + Add to start tracking':'Switch filter to see other stages'}</div></div>
      ):filtered.map(e=>{const st=STAGE_STYLE[e.stage];return(
        <div key={e.id} style={{background:'#fff',border:'1.5px solid var(--g200)',borderRadius:14,padding:'16px 18px',marginBottom:10,animation:'fadeUp .3s ease'}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:3,flexWrap:'wrap'}}>
                <span style={{fontFamily:'Bricolage Grotesque',fontSize:15,fontWeight:800,color:'var(--g900)'}}>{e.company}</span>
                <span style={{fontSize:12,color:'var(--g500)'}}>·</span>
                <span style={{fontSize:13,color:'var(--g600)',fontWeight:500}}>{e.role}</span>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                <span style={{fontSize:10,color:'var(--g400)'}}>{e.applied_at||e.date||''}</span>
                {e.note&&<span style={{fontSize:11,color:'var(--g500)',fontStyle:'italic'}}>"{e.note}"</span>}
                {e.url&&<a href={e.url} target="_blank" rel="noreferrer" style={{fontSize:11,color:'var(--i600)',fontWeight:600,textDecoration:'none'}}>View posting</a>}
              </div>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
              <select value={e.stage} onChange={ev=>updateStage(e.id,ev.target.value)} style={{fontSize:11,fontWeight:700,padding:'4px 10px',borderRadius:8,border:'1.5px solid '+st.border,background:st.bg,color:st.color,cursor:'pointer',fontFamily:'Inter',outline:'none'}}>{APP_STAGES.map(s=><option key={s}>{s}</option>)}</select>
              <button onClick={()=>remove(e.id)} style={{background:'transparent',border:'none',color:'var(--g300)',cursor:'pointer',fontSize:16,padding:'2px 4px'}}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:"inline-block",verticalAlign:"-2px"}}><path d="M18 6L6 18M6 6l12 12"/></svg></button>
            </div>
          </div>
        </div>
      );})}
    </div>
  );
}
function SkillFlashCards({skills,visible,onDismiss}){
  const [cards,setCards]=React.useState([]);
  const [current,setCurrent]=React.useState(0);
  const [flipped,setFlipped]=React.useState(false);
  const [search,setSearch]=React.useState('');
  const [activeCat,setActiveCat]=React.useState('All');
  const [dismissed,setDismissed]=React.useState(false);
  const [minimized,setMinimized]=React.useState(false);

  const ALL_CARDS=[
    // ── Python ──
    {cat:'Python',term:'Python',what:'Python is a general-purpose, high-level programming language known for clean readable syntax. It dominates data science, machine learning, automation, web backends, and scripting. The vast ecosystem of libraries like NumPy, Pandas, Flask, and TensorFlow makes it the single most versatile language in tech today.',why:'Appears in 70%+ of tech internship job posts. Recruiters filter out resumes without Python first — it is the baseline expectation for any data or ML role.',tip:'Pin a GitHub project that shows real-world Python: a web scraper, REST API, or data pipeline. Add a README explaining what problem it solves.'},
    {cat:'Python',term:'Pandas',what:'Pandas is Python\'s primary data manipulation library. It provides two core structures — Series (1D) and DataFrame (2D) — for loading, cleaning, filtering, grouping, merging, and reshaping tabular data. It reads CSV, Excel, JSON, SQL and more. Vectorised operations make it far faster than writing raw Python loops.',why:'Every data analyst and data science interview includes Pandas questions. Companies use it daily for data pipelines, reporting, and analysis.',tip:'Practice the essentials: read_csv, groupby, merge/join, fillna, apply, pivot_table. Solve 10 Pandas problems on LeetCode to get interview-ready.'},
    {cat:'Python',term:'NumPy',what:'NumPy (Numerical Python) provides the ndarray — an n-dimensional array object — and mathematical operations on those arrays implemented in C for speed. It handles matrix algebra, random number generation, Fourier transforms, and statistical operations. Almost every ML and scientific library is built on top of NumPy.',why:'Foundation of the entire Python data science stack. ML engineers must understand NumPy to debug tensor shape errors, manipulate model inputs, and understand what libraries do under the hood.',tip:'Master array slicing, broadcasting rules, axis operations, and reshape. These come up in every ML coding interview.'},
    {cat:'Python',term:'Flask',what:'Flask is a lightweight Python micro-framework for building web applications and REST APIs. Unlike Django, it makes no assumptions — you add only what you need. A basic "Hello World" API takes under 10 lines. It supports routing, request/response handling, JSON serialisation, file uploads, and middleware via extensions.',why:'Most Python ML deployment roles and backend intern jobs list Flask. It is the go-to tool for wrapping ML models into callable APIs.',tip:'Build a REST API that wraps an ML model — take input, run prediction, return JSON result. Deploy it on Render free tier and put the live URL on your resume.'},
    {cat:'Python',term:'Scikit-learn',what:'Scikit-learn is Python\'s standard machine learning library with 50+ algorithms covering classification, regression, clustering, and dimensionality reduction. It provides a consistent fit/transform/predict API across all models, plus tools for cross-validation, hyperparameter tuning (GridSearchCV), pipelines, and evaluation metrics.',why:'The most expected ML library in data science interviews. Every DS role assumes you know scikit-learn — it is the benchmark before you move to deep learning frameworks.',tip:'Know the complete ML workflow: train-test split, StandardScaler, cross_val_score, GridSearchCV, confusion_matrix, and classification_report. Practice building full pipelines.'},
    {cat:'Python',term:'Matplotlib',what:'Matplotlib is Python\'s foundational plotting library for creating static, animated, and interactive visualisations. It provides fine-grained control over every element of a figure — axes, labels, colors, legends, subplots. Seaborn and Pandas plot() are both built on top of it.',why:'Data visualisation is required in every analytics and data science role. Interviewers expect you to explain your findings with clear charts, not just numbers.',tip:'Know: line, bar, scatter, histogram, heatmap, subplots. Practice building a full EDA (exploratory data analysis) notebook with multiple charts on a Kaggle dataset.'},
    {cat:'Python',term:'Seaborn',what:'Seaborn is a statistical visualisation library built on Matplotlib that produces beautiful charts with far less code. It natively understands Pandas DataFrames and supports violin plots, box plots, pair plots, regression plots, heatmaps, and more — with automatic grouping by category columns.',why:'Used heavily in EDA and research presentations. Its charts look more professional than raw Matplotlib and require far less code — recruiters notice clean visuals.',tip:'Learn: sns.heatmap for correlation matrices, sns.pairplot for multi-variable exploration, sns.boxplot and sns.violinplot for distributions. These are EDA essentials.'},
    // ── ML & AI ──
    {cat:'ML & AI',term:'Machine Learning',what:'Machine learning is a subset of AI where algorithms learn patterns from data to make predictions or decisions without being explicitly programmed for each case. It splits into supervised learning (labelled data, predicts output), unsupervised learning (finds hidden structure), and reinforcement learning (learns by reward). The core workflow is: collect data → clean → engineer features → train model → evaluate → deploy.',why:'Highest-paying skill cluster in tech. ML engineers earn 35-50% more than average software engineers. Every product company is adding ML to their stack.',tip:'Start with Andrew Ng\'s free Machine Learning Specialisation on Coursera — it builds intuition before code. Then do 3 end-to-end projects on Kaggle.'},
    {cat:'ML & AI',term:'Deep Learning',what:'Deep learning uses artificial neural networks with many layers (hence "deep") to learn hierarchical representations of data. Early layers learn simple features (edges, tones), deeper layers learn complex ones (faces, objects, sentiment). Convolutional Neural Networks (CNNs) dominate image tasks; Recurrent Networks (RNNs) and Transformers dominate text. Training requires GPUs and large datasets.',why:'Powers ChatGPT, image recognition, speech assistants, and recommendation systems. Deep learning roles pay 50-80% more than classical ML roles.',tip:'Start with a simple image classifier using Keras on MNIST or CIFAR-10. Keep it under 50 lines. That one working project gives you the mental model for everything else.'},
    {cat:'ML & AI',term:'NLP',what:'Natural Language Processing (NLP) is a field of AI focused on enabling computers to understand, interpret, and generate human language. Tasks include sentiment analysis, named entity recognition, text classification, machine translation, question answering, and text generation. Modern NLP is dominated by Transformer models (BERT, GPT, T5) available through Hugging Face.',why:'Powers resume parsers (like this one), chatbots, search engines, content moderation, and language tools at every major tech company.',tip:'Build a sentiment classifier on the IMDB movie review dataset using scikit-learn TF-IDF first, then upgrade to a Hugging Face transformer model. Document the accuracy improvement.'},
    {cat:'ML & AI',term:'TF-IDF',what:'TF-IDF (Term Frequency — Inverse Document Frequency) is an algorithm that scores how important a word is to a document relative to a collection. TF measures how often a word appears in the document; IDF penalises words that appear in many documents (like "the", "is"). The result is a vector representing each document. Cosine similarity between TF-IDF vectors measures document relevance.',why:'Powers search engines, resume-to-job matching systems, spam filters, and document classification. JobSearchy uses TF-IDF cosine similarity for your job match scores.',tip:'Understand the formula: score = TF(t,d) × log(N / DF(t)). This is asked in ML and NLP interviews. Implement it from scratch once to truly understand it.'},
    {cat:'ML & AI',term:'XGBoost',what:'XGBoost (eXtreme Gradient Boosting) is an optimised decision tree ensemble algorithm that builds trees sequentially, each one correcting the errors of the previous. It uses second-order Taylor expansion for loss optimisation, regularisation to prevent overfitting, and parallel processing for speed. It consistently wins structured/tabular data ML competitions.',why:'Appears in 90%+ of Kaggle winning solutions on tabular data. Standard tool in finance, healthcare, and business analytics — wherever structured data is king.',tip:'Learn the key hyperparameters: n_estimators, max_depth, learning_rate, subsample, colsample_bytree. Use early stopping to avoid overfitting. Combine with SHAP for explainability.'},
    {cat:'ML & AI',term:'SHAP',what:'SHAP (SHapley Additive exPlanations) is a framework for explaining individual predictions of any ML model using Shapley values from game theory. For each prediction, SHAP assigns each feature a contribution value — positive (pushed prediction up) or negative (pushed it down). It produces waterfall plots, summary plots, and dependency plots that reveal model behaviour.',why:'Model explainability is legally required in finance, insurance, and healthcare. Companies deploying ML need to justify decisions to regulators. Explainability engineers are in high demand.',tip:'Run shap.Explainer on your XGBoost model and visualise summary_plot and waterfall_plot. This one addition transforms a model project into a portfolio-worthy case study.'},
    {cat:'ML & AI',term:'Hugging Face',what:'Hugging Face is an AI platform providing thousands of pre-trained transformer models (BERT, GPT-2, T5, Llama, Mistral) via a simple Python API. The transformers library lets you load a state-of-the-art model in 3 lines and fine-tune it on your data. Models are available for text, images, audio, and multimodal tasks.',why:'The go-to platform for modern NLP and GenAI. Knowing Hugging Face is increasingly required for AI/ML intern roles. It dramatically reduces time to build working AI applications.',tip:'Build an image captioning app with VisionEncoderDecoder (ViT + GPT-2) or a text classifier with BERT. Deploy it on Gradio and put the live link on your resume.'},
    {cat:'ML & AI',term:'LLM',what:'Large Language Models (LLMs) are transformer-based neural networks trained on massive text corpora to predict and generate human language. GPT-4, Claude, Gemini, and Llama are examples. They power chatbots, code assistants, summarisers, and agents. Fine-tuning adapts them to specific domains. Prompt engineering controls their behaviour without retraining.',why:'LLMs are the most transformative technology since smartphones. Every tech company is adding LLM features. Engineers who understand and can deploy LLMs earn significantly more.',tip:'Build a simple RAG (Retrieval-Augmented Generation) chatbot using LangChain and a free LLM API. This single project demonstrates both LLM understanding and practical engineering skills.'},
    {cat:'ML & AI',term:'Computer Vision',what:'Computer vision is the field of AI that enables machines to interpret and understand visual data — images and video. Core tasks include image classification, object detection (YOLO, Faster-RCNN), semantic segmentation, face recognition, and image generation (GANs, Diffusion). OpenCV handles classical vision; PyTorch/TensorFlow handle deep learning approaches.',why:'Computer vision powers self-driving cars, medical imaging, surveillance, retail checkout, and AR. CV engineers are among the highest paid in AI.',tip:'Build an object detection project using YOLOv8 (ultralytics library) — it takes under 10 lines to run on your webcam. Deploy it as a Gradio app. This project stands out in any portfolio.'},
    // ── Web Dev ──
    {cat:'Web Dev',term:'React',what:'React is a JavaScript library for building fast, interactive user interfaces through a component-based architecture. UI is broken into reusable components with local state. The virtual DOM diffs only the changed parts, making updates efficient. Hooks (useState, useEffect, useContext) manage state and side effects without class components. React is maintained by Meta.',why:'Most requested frontend skill globally — appears in 80%+ of web development job posts. React knowledge unlocks full-stack, frontend, and product engineer roles.',tip:'Build a CRUD application (todo list, job tracker, expense tracker) that connects to a REST API. Deploy it on Vercel free tier. This is the standard "can you build a real app?" interview bar.'},
    {cat:'Web Dev',term:'REST API',what:'REST (Representational State Transfer) is an architectural style for designing networked APIs using HTTP. Resources are accessed via URLs, and operations use HTTP methods: GET (read), POST (create), PUT/PATCH (update), DELETE (remove). Responses return JSON. Stateless — each request contains all needed information. Almost every web and mobile app communicates via REST APIs.',why:'Fundamental to every web and mobile backend role. Full-stack, backend, and ML deployment jobs all require REST API knowledge. It is the universal language between frontend and backend.',tip:'Build and document a REST API with Flask or FastAPI. Use Postman to test all endpoints. Understand status codes: 200 OK, 201 Created, 400 Bad Request, 401 Unauthorized, 404 Not Found, 500 Server Error.'},
    {cat:'Web Dev',term:'Docker',what:'Docker is a containerisation platform that packages an application and all its dependencies (libraries, runtime, config) into a portable, isolated container. Containers run identically on any machine that has Docker installed — no more "works on my laptop" problems. Docker Compose orchestrates multiple containers (app + database + cache) with a single file.',why:'Employers want engineers who can ship software reliably, not just write code locally. Docker knowledge is now expected even for junior and intern roles at product companies.',tip:'Dockerise your Flask or FastAPI app: write a Dockerfile, build the image, run it locally, then push to Docker Hub. Add the Docker Hub link to your resume under the project.'},
    {cat:'Web Dev',term:'FastAPI',what:'FastAPI is a modern Python framework for building high-performance REST APIs. It automatically generates OpenAPI documentation (Swagger UI) from type hints, validates request/response data via Pydantic, and supports async/await for concurrent requests. It is significantly faster than Flask for IO-bound tasks.',why:'Growing rapidly in startups and ML serving teams. Often preferred over Flask for new API projects due to auto-docs, type safety, and async support. Common in ML deployment roles.',tip:'Build a prediction API: accept JSON input, run an ML model, return prediction with confidence score. Add the auto-generated Swagger docs URL to your resume — interviewers are impressed by live documentation.'},
    {cat:'Web Dev',term:'Node.js',what:'Node.js is a JavaScript runtime that executes JS outside the browser, enabling server-side programming. Built on Chrome\'s V8 engine, it uses an event-driven, non-blocking I/O model making it efficient for real-time applications. Express.js is the most popular Node.js framework for building web servers and REST APIs.',why:'Powers the backends of LinkedIn, Netflix, Uber, and PayPal. Full-stack JS (React frontend + Node.js backend) is one of the most common stacks at Indian startups.',tip:'Build a simple Express.js REST API with CRUD operations on a MongoDB database. This MERN stack (MongoDB, Express, React, Node) project is a standard portfolio piece for full-stack roles.'},
    // ── Database ──
    {cat:'Database',term:'SQL',what:'SQL (Structured Query Language) is the standard language for communicating with relational databases. Core operations: SELECT (query data), INSERT (add rows), UPDATE (modify), DELETE (remove), JOIN (combine tables), GROUP BY (aggregate), and subqueries. Window functions (ROW_NUMBER, RANK, LAG, LEAD) are advanced features used in analytics.',why:'Required without exception in every data analyst, data scientist, backend, and full-stack role. SQL is the single most universally expected technical skill across all tech jobs in India.',tip:'Practice daily on LeetCode SQL (Easy→Medium→Hard). Know: INNER/LEFT/RIGHT JOIN, GROUP BY with HAVING, subqueries, window functions (RANK, ROW_NUMBER, SUM OVER), and CTEs (WITH clause).'},
    {cat:'Database',term:'PostgreSQL',what:'PostgreSQL is the world\'s most advanced open-source relational database. It supports complex queries, full-text search, JSON (JSONB) storage, geospatial data (PostGIS), custom functions, and advanced indexing (B-tree, GiST, GIN). It is ACID-compliant, handles concurrent transactions safely, and scales from personal projects to production systems serving millions.',why:'The standard production database at serious tech companies. Backend and data engineering roles increasingly specify Postgres over MySQL. Learning Postgres signals you take databases seriously.',tip:'Learn EXPLAIN ANALYZE to understand query performance. Practice: indexes (when to use and what type), JSONB queries, window functions, and transactions (BEGIN/COMMIT/ROLLBACK).'},
    {cat:'Database',term:'MongoDB',what:'MongoDB is a document-oriented NoSQL database that stores data as flexible BSON (Binary JSON) documents in collections. No fixed schema — each document can have different fields. Supports rich queries, aggregation pipelines, indexing, replication, and horizontal scaling via sharding. Ideal for applications where data structure evolves frequently.',why:'Standard database for modern JavaScript applications (MERN stack). Widely used at Indian startups building web applications that need flexible, schema-free data storage.',tip:'Know when to use MongoDB vs SQL — this is a classic system design interview question. Answer: MongoDB for flexible/evolving schemas and document-like data; SQL for complex relationships and ACID transactions.'},
    {cat:'Database',term:'Redis',what:'Redis (Remote Dictionary Server) is an in-memory key-value store that operates at microsecond speeds. It supports strings, hashes, lists, sets, sorted sets, and pub/sub messaging. Primary use cases: caching API responses (dramatically reduces DB load), session storage, real-time leaderboards, rate limiting, and message queues.',why:'Present in the architecture of almost every high-scale web application. Backend roles at product companies often involve Redis for caching. Understanding caching is a key system design concept.',tip:'Implement a simple cache layer: check Redis first, if miss fetch from DB and store in Redis with TTL expiry. This pattern alone handles 80% of Redis use cases in real applications.'},
    // ── DevOps ──
    {cat:'DevOps',term:'Git',what:'Git is a distributed version control system that tracks changes to files over time. Every developer works on a local copy of the full history. Core concepts: commits (snapshots), branches (parallel work streams), merge (combine branches), rebase (rewrite history cleanly), pull requests (propose changes for review). GitHub and GitLab host remote repositories.',why:'Non-negotiable for every tech role without exception. No Git knowledge means immediate rejection. It is the fundamental collaboration tool for all software development.',tip:'Beyond basics, learn: git rebase -i (squash commits), git cherry-pick (copy specific commits), git bisect (find which commit introduced a bug), and git stash. These are asked in senior interviews.'},
    {cat:'DevOps',term:'AWS',what:'Amazon Web Services is the world\'s largest cloud platform with 200+ services. Key services for students: EC2 (virtual machines), S3 (file/object storage), Lambda (serverless functions), RDS (managed databases), API Gateway (API management), and IAM (identity and permissions). AWS has a free tier covering most services for 12 months.',why:'Used by 33% of all cloud workloads globally. Most backend, DevOps, and data engineering job posts specify AWS experience. AWS certifications (especially Cloud Practitioner) are recognised shortcuts.',tip:'Get the AWS Cloud Practitioner certification (free exam prep, $100 exam fee or free vouchers via AWS Educate). Deploy a full-stack app on EC2 + RDS and put the architecture diagram on your resume.'},
    {cat:'DevOps',term:'CI/CD',what:'CI/CD (Continuous Integration / Continuous Deployment) automates the software delivery pipeline. CI automatically runs tests whenever code is pushed to a repository. CD automatically deploys passing builds to production. GitHub Actions, GitLab CI, Jenkins, and CircleCI are common tools. A CI/CD pipeline typically: lint code → run unit tests → build Docker image → deploy to server.',why:'Expected at every product company. Demonstrates professional engineering practices beyond just writing code. Engineers with CI/CD experience ship features faster and with fewer production bugs.',tip:'Set up a GitHub Actions workflow that runs on every push: install dependencies, run tests, and deploy to Render or Railway. The .github/workflows/deploy.yml file becomes a talking point in every interview.'},
    {cat:'DevOps',term:'Linux',what:'Linux is an open-source operating system used on 96% of the world\'s servers, all Android devices, and most supercomputers. Essential commands: ls, cd, cp, mv, rm (file operations), grep (search text), find (locate files), chmod (permissions), ps/kill (process management), ssh (remote access), cron (scheduled jobs), and pipe (|) for chaining commands.',why:'All cloud servers (AWS EC2, GCP, Azure VMs) run Linux. Backend engineers, DevOps, and data engineers must be comfortable in a terminal. Inability to use Linux is a red flag in technical interviews.',tip:'Install Ubuntu on WSL2 (Windows Subsystem for Linux) and use it daily. Write a shell script that automates a repetitive task — backup, data download, or report generation. Put it on GitHub.'},
    // ── Stats & Research ──
    {cat:'Stats & Research',term:'Econometrics',what:'Econometrics applies statistical methods to economic and financial data to quantify relationships, test hypotheses, and forecast outcomes. Core methods: OLS regression (estimate linear relationships), time series analysis (ADF test for stationarity, ARIMA for forecasting), panel data models (fixed/random effects), and IV regression (handle endogeneity). Python\'s statsmodels library implements these.',why:'Essential for research analyst, quantitative analyst, policy research, and central bank roles (RBI, SEBI, NITI Aayog). A rare skill among CS students — makes your profile stand out heavily in research and finance domains.',tip:'Already in your profile. Write a research note (2-3 pages) applying econometrics to a real question — inflation vs repo rate, GDP vs unemployment, stock price vs news sentiment. Submit it to a student journal or post on LinkedIn.'},
    {cat:'Stats & Research',term:'Statsmodels',what:'Statsmodels is a Python library for estimating and testing statistical models. It provides OLS and GLS regression, logit/probit for binary outcomes, time series models (ARIMA, VAR, GARCH), survival analysis, and comprehensive statistical tests. Unlike scikit-learn which focuses on prediction, statsmodels focuses on inference — p-values, confidence intervals, hypothesis tests.',why:'Required for rigorous academic and policy research roles. Finance, consulting, and research firms expect you to interpret regression output (coefficients, p-values, R², F-stat) correctly. This separates analysts from engineers.',tip:'Already in your profile. Practice reading and interpreting a full OLS regression table: coefficient values, standard errors, t-statistics, p-values, R², F-statistic. This is asked verbally in every quantitative research interview.'},
    {cat:'Stats & Research',term:'SciPy',what:'SciPy is Python\'s scientific computing library built on NumPy. It provides algorithms for optimisation (minimize, curve_fit), integration (quad, dblquad), linear algebra (solve, svd), signal processing (fft, filter), statistics (t-test, chi-square, Pearson r, Spearman r, Mann-Whitney U, Kruskal-Wallis), and interpolation.',why:'Required for any role involving rigorous statistical analysis, signal processing, or scientific computing. Academic research, engineering analysis, and quantitative finance roles all use SciPy.',tip:'Already in your profile. Know the key statistical tests and when to use each: t-test (compare two means, normal data), Mann-Whitney U (non-parametric alternative), chi-square (categorical association), Pearson (linear correlation), Spearman (monotonic correlation).'},
    {cat:'Stats & Research',term:'Tableau',what:'Tableau is a business intelligence and data visualisation platform that enables creating interactive dashboards, charts, and reports through a drag-and-drop interface — no coding required. It connects to databases, spreadsheets, and cloud sources. Tableau Public is free and lets you publish interactive dashboards online.',why:'Most requested BI tool in analyst roles at Indian companies — especially in BFSI (banking, financial services, insurance), consulting, and e-commerce. Many analyst job posts list Tableau as required.',tip:'Already in your profile. Build a public Tableau dashboard on a publicly available dataset (Indian economic data, IPL cricket, Zomato restaurants). Publish it on Tableau Public and share the link on LinkedIn and your resume.'},
    {cat:'Stats & Research',term:'Power BI',what:'Microsoft Power BI is a business intelligence tool for creating interactive reports and dashboards. It connects to Excel, SQL Server, Azure, and 100+ data sources. DAX (Data Analysis Expressions) is its formula language for calculated columns and measures. Power BI Desktop is free; sharing requires a Pro licence. It integrates natively with the Microsoft ecosystem.',why:'The most widely used BI tool in Indian corporates, banks, and MNCs due to Microsoft ecosystem dominance. Most non-tech companies use Power BI for analytics. A common requirement in analyst and data roles at BFSI and consulting firms.',tip:'Build a Power BI report on public financial data (NSE/BSE stock prices, RBI monetary policy data). Export it as a PDF report and add it to your resume portfolio with a screenshot.'},
    {cat:'Stats & Research',term:'Hypothesis Testing',what:'Hypothesis testing is a statistical framework for making data-driven decisions under uncertainty. The null hypothesis (H0) assumes no effect. The alternative hypothesis (H1) claims an effect exists. You collect data, compute a test statistic and p-value. If p < significance level (0.05), reject H0. Common tests: t-test, chi-square, ANOVA, Mann-Whitney U.',why:'Fundamental to every data science, analytics, and research role. A/B testing (used by every tech product company) is applied hypothesis testing. Getting this wrong in an interview signals weak statistical foundations.',tip:'Know by heart: what a p-value actually means (probability of observing data this extreme if H0 were true), the difference between Type I and Type II errors, and when to use parametric vs non-parametric tests.'},
    // ── Career ──
    {cat:'Career',term:'GitHub Profile',what:'Your GitHub profile is your public engineering portfolio — every project, commit, and contribution is visible to any recruiter who looks you up. A strong profile has: a pinned selection of 4-6 best projects, detailed READMEs with problem statement, tech stack, installation instructions, and screenshots or live demo links, consistent contribution history, and meaningful commit messages.',why:'Recruiters check GitHub before interviews. A strong GitHub profile gets callbacks without applying — engineers are directly recruited from GitHub. A weak or empty profile is a missed opportunity.',tip:'Today: write a proper README for your best existing project. Add: what the project does, why you built it, tech stack, how to run it locally, and a link to the live demo. This single improvement has the highest ROI per minute spent.'},
    {cat:'Career',term:'Kaggle',what:'Kaggle is the world\'s largest data science community with ML competitions offering cash prizes, public datasets for practice, shared notebooks (Kernels) to learn from, and certifications. Kaggle rankings are recognized globally: Contributor → Expert → Master → Grandmaster. Getting to Expert rank (top 20% in 5 competitions) is achievable for students and adds strong signal to your resume.',why:'A Kaggle Expert badge is a credible, independently verified proof of ML skill — more trusted than a resume bullet point. Top-performing notebooks get shared widely and build your reputation.',tip:'Start with Getting Started competitions: Titanic (classification), House Prices (regression), Digit Recogniser (deep learning). Read top notebooks, understand the techniques, then write your own. Submit early — Kaggle ranks matter.'},
    {cat:'Career',term:'LinkedIn Profile',what:'LinkedIn is the primary professional network used by every recruiter in India and globally. A strong profile has: a professional headshot, a keyword-rich headline (not just "Student"), an About section explaining your skills and goals, all projects with descriptions and links, education with CGPA, work experience including internships and freelance work, and 500+ connections.',why:'70%+ of jobs are filled through LinkedIn connections or recruiter outreach. Applying cold through LinkedIn Easy Apply is less effective than being found by recruiters or referred through your network.',tip:'Optimise your headline: instead of "B.Tech Student at MITAOE" use "AI/ML Engineer | Python, XGBoost, Deep Learning | B.Tech CS @ MITAOE | IIM Lucknow National Finalist". Add all your projects and put live links.'},
    {cat:'Career',term:'System Design',what:'System design interviews ask you to architect a scalable distributed system from scratch — like designing Instagram, a URL shortener, or a ride-sharing backend. Key concepts: load balancers (distribute traffic), CDNs (serve static content fast), databases (SQL vs NoSQL tradeoffs), caching (Redis), message queues (Kafka), microservices, API gateways, and CAP theorem.',why:'Asked at every product company interview for software engineering roles. It is the single biggest differentiator between a candidate who codes and one who can build production systems.',tip:'Practice 5 classic designs: URL shortener (bit.ly), Twitter/Instagram feed, Uber/Ola backend, WhatsApp messaging, and Google Drive. Use the framework: requirements → estimation → high-level design → database schema → scale it.'},
    {cat:'Career',term:'Open Source',what:'Open source contribution means adding code, documentation, bug fixes, or translations to publicly available software projects on GitHub. It demonstrates: you can navigate large unfamiliar codebases, you write code others review, you communicate professionally with global developers, and you solve real problems used by real people.',why:'GitHub contributions are visible to every recruiter. Open source experience dramatically increases interview conversion rates. Some companies directly hire based on open source contributions without a formal interview.',tip:'Start with "good first issue" tagged issues on popular Python or data science repos on GitHub. Fix a small bug, improve documentation, or add a test case. Your first merged PR gives you a talking point in every interview.'},
  ];

  React.useEffect(()=>{
    if(!visible)return;
    setDismissed(false);setMinimized(false);setCurrent(0);setFlipped(false);setSearch('');setActiveCat('All');
  },[visible]);

  const cats=['All',...[...new Set(ALL_CARDS.map(c=>c.cat))]];
  const filtered=ALL_CARDS.filter(c=>{
    const matchCat=activeCat==='All'||c.cat===activeCat;
    const matchSearch=!search||c.term.toLowerCase().includes(search.toLowerCase())||c.what.toLowerCase().includes(search.toLowerCase());
    return matchCat&&matchSearch;
  });
  // Put user's skills first
  const userSet=new Set((skills||[]).map(s=>s.toLowerCase()));
  const sorted=[...filtered.filter(c=>userSet.has(c.term.toLowerCase())),...filtered.filter(c=>!userSet.has(c.term.toLowerCase()))];
  const card=sorted[current]||sorted[0];

  if(!visible||dismissed)return null;

  if(minimized)return(
    <div style={{position:'fixed',bottom:20,right:20,zIndex:500,animation:'fadeUp .3s ease'}}>
      <button onClick={()=>setMinimized(false)} style={{
        background:'linear-gradient(135deg,#1e1b4b,#4338ca)',
        border:'none',borderRadius:14,padding:'10px 18px',
        display:'flex',alignItems:'center',gap:8,cursor:'pointer',
        boxShadow:'0 4px 20px rgba(67,56,202,.4)',
      }}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span style={{fontSize:12,color:'#fff',fontWeight:700}}>Learn while waiting</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" strokeWidth="2.5"><path d="M18 15l-6-6-6 6"/></svg>
      </button>
    </div>
  );

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(15,23,42,0.65)',zIndex:400,display:'flex',alignItems:'center',justifyContent:'center',padding:16,animation:'fadeIn .2s ease'}}>
      <div style={{background:'#fff',borderRadius:24,width:'100%',maxWidth:560,maxHeight:'88vh',display:'flex',flexDirection:'column',boxShadow:'0 25px 60px rgba(0,0,0,.3)',animation:'fadeUp .35s cubic-bezier(.16,1,.3,1)',overflow:'hidden'}}>
        {/* Header */}
        <div style={{background:'linear-gradient(135deg,#1e1b4b,#4338ca)',padding:'20px 22px 16px',flexShrink:0}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:12}}>
            <div>
              <div style={{fontSize:11,color:'rgba(255,255,255,.55)',fontWeight:600,letterSpacing:'.8px',textTransform:'uppercase',marginBottom:3}}>Learn while Searchy works</div>
              <div style={{fontFamily:'Bricolage Grotesque',fontSize:20,fontWeight:800,color:'#fff',lineHeight:1.2}}>Skill Flashcards</div>
              <div style={{fontSize:11,color:'rgba(255,255,255,.5)',marginTop:3}}>{sorted.length} cards · tap a card to flip it</div>
            </div>
            <div style={{display:'flex',gap:6,marginTop:2}}>
              <button onClick={()=>setMinimized(true)} style={{background:'rgba(255,255,255,.12)',border:'none',borderRadius:8,padding:'6px 10px',fontSize:11,color:'rgba(255,255,255,.8)',cursor:'pointer',fontWeight:600}}>— hide</button>
              <button onClick={onDismiss} style={{background:'rgba(255,255,255,.12)',border:'none',borderRadius:8,width:30,height:30,fontSize:13,color:'rgba(255,255,255,.8)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
            </div>
          </div>
          <input value={search} onChange={e=>{setSearch(e.target.value);setCurrent(0);setFlipped(false);}}
            placeholder="Search any skill — Python, Docker, SQL, React..."
            style={{width:'100%',padding:'8px 14px',borderRadius:9,border:'none',fontSize:12,background:'rgba(255,255,255,.12)',color:'#fff',outline:'none',fontFamily:'Inter'}}
            onFocus={e=>e.target.style.background='rgba(255,255,255,.2)'}
            onBlur={e=>e.target.style.background='rgba(255,255,255,.12)'}
          />
          {skills&&skills.length>0&&<div style={{fontSize:10,color:'rgba(255,255,255,.4)',marginTop:5,paddingLeft:2}}>Your skills shown first: {skills.slice(0,4).join(', ')}{skills.length>4?' +more':''}</div>}
        </div>
        {/* Category tabs */}
        <div style={{display:'flex',gap:5,padding:'10px 14px 6px',overflowX:'auto',flexShrink:0,borderBottom:'1px solid #f1f5f9',scrollbarWidth:'none'}}>
          {cats.map(c=>(
            <button key={c} onClick={()=>{setActiveCat(c);setCurrent(0);setFlipped(false);}} style={{
              padding:'4px 11px',borderRadius:99,fontSize:11,fontWeight:600,border:'1.5px solid',
              whiteSpace:'nowrap',cursor:'pointer',transition:'all .15s',fontFamily:'Inter',flexShrink:0,
              borderColor:activeCat===c?'#4338ca':'#e2e8f0',
              background:activeCat===c?'#4338ca':'transparent',
              color:activeCat===c?'#fff':'#64748b',
            }}>{c}</button>
          ))}
        </div>
        {/* Card area */}
        <div style={{flex:1,overflowY:'auto',padding:'16px 20px 0'}}>
          {sorted.length===0?(
            <div style={{textAlign:'center',padding:'40px 0',color:'#94a3b8'}}>
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" style={{margin:'0 auto 8px',display:'block'}}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <div style={{fontWeight:600}}>No cards match "{search}"</div>
            </div>
          ):(
            <>
              {card&&(
                <div onClick={()=>setFlipped(f=>!f)} style={{
                  background:flipped?'linear-gradient(135deg,#f0fdf4,#dcfce7)':'linear-gradient(135deg,#eef2ff,#e0e7ff)',
                  border:`2px solid ${flipped?'#86efac':'#c7d2fe'}`,
                  borderRadius:16,padding:'20px',cursor:'pointer',
                  minHeight:160,transition:'background .3s,border .3s',marginBottom:12,
                  boxShadow:flipped?'0 4px 20px rgba(21,128,61,.1)':'0 4px 20px rgba(67,56,202,.08)',
                }}>
                  <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:12}}>
                    <div>
                      <div style={{fontSize:10,color:'#94a3b8',fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:3}}>{card.cat}</div>
                      <div style={{fontFamily:'Bricolage Grotesque',fontSize:22,fontWeight:800,color:'#1e1b4b',lineHeight:1.1}}>{card.term}</div>
                    </div>
                    <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:5}}>
                      {userSet.has(card.term.toLowerCase())&&(
                        <span style={{fontSize:9,fontWeight:700,padding:'2px 8px',borderRadius:99,background:'#f0fdf4',color:'#15803d',border:'1px solid #86efac'}}>In your profile</span>
                      )}
                      <span style={{fontSize:10,color:'#94a3b8'}}>{current+1}/{sorted.length}</span>
                    </div>
                  </div>
                  {!flipped?(
                    <div>
                      <div style={{fontSize:14,color:'#1e293b',lineHeight:1.7,fontWeight:500,marginBottom:10}}>{card.what}</div>
                      <div style={{display:'flex',alignItems:'center',gap:6,padding:'7px 11px',background:'rgba(99,102,241,.07)',borderRadius:8,fontSize:11,color:'#4338ca',fontWeight:600}}>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
                        Tap to see why recruiters care + pro tip
                      </div>
                    </div>
                  ):(
                    <div>
                      <div style={{marginBottom:10}}>
                        <div style={{fontSize:10,fontWeight:700,color:'#15803d',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:4}}>Why recruiters care</div>
                        <div style={{fontSize:14,color:'#14532d',lineHeight:1.7,fontWeight:500}}>{card.why}</div>
                      </div>
                      <div style={{background:'rgba(21,128,61,.08)',border:'1px solid #86efac',borderRadius:9,padding:'9px 12px'}}>
                        <div style={{fontSize:10,fontWeight:700,color:'#15803d',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:3}}>Pro tip</div>
                        <div style={{fontSize:12,color:'#166534',lineHeight:1.6}}>{card.tip}</div>
                      </div>
                    </div>
                  )}
                </div>
              )}
              {/* Card strip */}
              {sorted.length>1&&(
                <div style={{display:'flex',gap:7,marginBottom:12,overflowX:'auto',paddingBottom:4,scrollbarWidth:'none'}}>
                  {sorted.slice(0,7).map((c,i)=>(
                    <div key={i} onClick={()=>{setCurrent(i);setFlipped(false);}} style={{
                      flexShrink:0,padding:'7px 10px',borderRadius:9,cursor:'pointer',minWidth:64,textAlign:'center',
                      border:`1.5px solid ${i===current?'#4338ca':'#e2e8f0'}`,
                      background:i===current?'#4338ca':'#fff',transition:'all .2s',
                    }}>
                      <div style={{fontSize:9,fontWeight:700,color:i===current?'#fff':'#334155',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{c.term}</div>
                    </div>
                  ))}
                  {sorted.length>7&&<div style={{flexShrink:0,padding:'7px 10px',borderRadius:9,border:'1.5px solid #e2e8f0',background:'#f8fafc',display:'flex',alignItems:'center'}}><span style={{fontSize:10,color:'#94a3b8',fontWeight:600}}>+{sorted.length-7}</span></div>}
                </div>
              )}
            </>
          )}
        </div>
        {/* Footer nav */}
        <div style={{padding:'12px 20px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',borderTop:'1px solid #f1f5f9',flexShrink:0}}>
          <div style={{display:'flex',gap:4}}>
            {sorted.slice(0,Math.min(sorted.length,8)).map((_,i)=>(
              <div key={i} onClick={()=>{setCurrent(i);setFlipped(false);}} style={{width:i===current?18:6,height:6,borderRadius:99,cursor:'pointer',background:i===current?'#4338ca':'#e2e8f0',transition:'all .3s'}}/>
            ))}
            {sorted.length>8&&<span style={{fontSize:10,color:'#94a3b8',marginLeft:4,alignSelf:'center'}}>+{sorted.length-8}</span>}
          </div>
          <div style={{display:'flex',gap:7}}>
            <button onClick={()=>{setCurrent(c=>(c-1+sorted.length)%sorted.length);setFlipped(false);}} style={{background:'#f1f5f9',border:'none',borderRadius:9,padding:'8px 16px',fontSize:12,color:'#334155',cursor:'pointer',fontWeight:700}}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:"inline-block",verticalAlign:"-2px",marginRight:4}}><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Prev</button>
            <button onClick={()=>{setCurrent(c=>(c+1)%sorted.length);setFlipped(false);}} style={{background:'#4338ca',border:'none',borderRadius:9,padding:'8px 16px',fontSize:12,color:'#fff',cursor:'pointer',fontWeight:700,boxShadow:'0 2px 8px rgba(67,56,202,.3)'}}>Next<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:"inline-block",verticalAlign:"-2px",marginLeft:4}}><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  );
}

function PipelinePanel({showToast,onFindJobs,findRunning,profile}){
  const [status,setStatus]=useState({running:false,message:'',progress:0});
  const funRef=useRef();
  const [email,setEmail]=useState(profile?.email||'');
  const [sending,setSending]=useState(false);
  const [days,setDays]=useState(7);
  const ivRef=useRef();
  const chips=[1,5,10,15,20,30];
  const profileSkills=profile?.skills?.technical||[];

  useEffect(()=>{
    // Always-on poll — catches pipelines started from ANY button (ResumeTab or PipelinePanel)
    const poll=setInterval(async()=>{
      const s=await api.get('/api/pipeline-status');
      if(s&&!s.error) setStatus(s);
    },1500);
    // Listen for pipeline-done from any source
    const onDone=()=>{
      clearInterval(ivRef.current);clearInterval(funRef.current);
      setFunMsg('Done! Jobs are ready.');
      setTimeout(()=>setFunMsg(''),3000);
    };
    window.addEventListener('pipeline-done',onDone);
    return()=>{clearInterval(poll);window.removeEventListener('pipeline-done',onDone);};
  },[]);

  function pct(){return Math.round(((days-1)/29)*100)+'%'}

  const [funMsg,setFunMsg]=useState('');
  const funMsgs=[
    'Scanning Internshala...',
    'Reading job descriptions...',
    'Hunting your dream job...',
    'Crunching match scores...',
    'Finding your best matches...',
    'Filtering relevant jobs...',
    'AI analyzing skills...',
    'This may take a minute...',
    'Searching all platforms...',
    'Matching skills to jobs...',
  ];

  async function run(){
    const r=await api.post('/api/run-pipeline',{days});
    if(r.error){showToast(r.error,'error');return;}
    showToast('Pipeline started','info');
    // Rotate fun messages every 2.5s
    let mi=0;setFunMsg(funMsgs[0]);
    funRef.current=setInterval(()=>{mi=(mi+1)%funMsgs.length;setFunMsg(funMsgs[mi]);},2500);
    ivRef.current=setInterval(async()=>{
      const s=await api.get('/api/pipeline-status');
      if(s&&!s.error){
        setStatus(s);
        if(!s.running){
          clearInterval(ivRef.current);
          clearInterval(funRef.current);
          setFunMsg('Done! Jobs are ready.');
          setTimeout(()=>{setFunMsg('');setStatus(st=>({...st,progress:0}));},3000);
          showToast(s.message,'success');
          window.dispatchEvent(new CustomEvent('pipeline-done'));
        }
      }
    },1500);
  }

  async function sendDigest(){
    setSending(true);const r=await api.post('/api/send-digest',{email});setSending(false);
    r.error?showToast(r.error,'error'):showToast('Digest sent!','success');
  }

  return(
    <div className="rp">
      {onFindJobs&&(
        <>
          <div>
            <div className="rp-title">Find Jobs</div>
            <button onClick={onFindJobs} disabled={findRunning}
              style={{width:'100%',padding:'11px',background:findRunning?'#6366f1':'#4338ca',color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:findRunning?'not-allowed':'pointer',fontFamily:'Bricolage Grotesque',transition:'all .2s',display:'flex',alignItems:'center',justifyContent:'center',gap:7,boxShadow:'0 2px 8px rgba(67,56,202,.25)'}}>
              {findRunning?<><span className="spinner"/>Searching...</>:(<>Find My Jobs<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:"inline-block",verticalAlign:"-2px",marginLeft:4}}><path d="M5 12h14M12 5l7 7-7 7"/></svg></>)}
            </button>
          </div>
          <div className="div"/>
        </>
      )}
      <div>
        <div className="rp-title">Search Range</div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:2}}>
          <span style={{color:'var(--g500)'}}>Jobs posted in last</span>
          <span style={{fontWeight:700,color:'var(--i600)',fontFamily:'Bricolage Grotesque'}}>{days} day{days>1?'s':''}</span>
        </div>
        <input type="range" min="1" max="30" value={days} className="ds" style={{'--pct':pct()}}
          onChange={e=>{const v=Number(e.target.value);setDays(v);e.target.style.setProperty('--pct',Math.round(((v-1)/29)*100)+'%')}}/>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--g300)'}}>
          <span>Today</span><span>30 days</span>
        </div>
        <div className="qc">{chips.map(d=><button key={d} className={`chip${days===d?' active':''}`} onClick={()=>setDays(d)}>{d===1?'Today':`${d}d`}</button>)}</div>
      </div>
      <div className="div"/>
      <div>
        <div className="rp-title">Run Pipeline</div>
        <div style={{display:'flex',gap:6}}>
          <button className="run-btn" onClick={run} disabled={status.running} style={{flex:1}}>
            {status.running?<><span className="spinner"/>Running…</>:(<><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style={{display:"inline-block",verticalAlign:"-1px",marginRight:6}}><path d="M8 5v14l11-7z"/></svg>Run Pipeline</>)}
          </button>
          {status.running&&(
            <button onClick={async()=>{
              await api.post('/api/pipeline-reset',{});
              setStatus({running:false,message:'Reset.',progress:0});
              clearInterval(ivRef.current);
              clearInterval(funRef.current);
              setFunMsg('');
              showToast('Pipeline reset','info');
            }} style={{
              padding:'0 12px',background:'#fef2f2',color:'#b91c1c',
              border:'1.5px solid #fca5a5',borderRadius:10,
              fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'Inter',
              whiteSpace:'nowrap',flexShrink:0,
            }}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:"inline-block",verticalAlign:"-2px",marginRight:4}}><path d="M18 6L6 18M6 6l12 12"/></svg>Reset</button>
          )}
        </div>
        {(status.progress>0||funMsg)&&(
          <div>
            {funMsg&&(
              <div style={{
                marginTop:8,padding:'9px 12px',
                background:'linear-gradient(135deg,#eef2ff,#e0e7ff)',
                border:'1px solid #c7d2fe',borderRadius:9,
                fontSize:11,color:'#3730a3',fontWeight:500,
                textAlign:'center',animation:'fadeIn .4s ease',
              }}>{funMsg}</div>
            )}
            {status.progress>0&&status.progress<100&&(
              <div style={{marginTop:8}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--g400)',marginBottom:4}}>
                  <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{status.message}</span>
                  <span style={{fontWeight:700,color:'var(--i600)',marginLeft:6}}>{status.progress}%</span>
                </div>
                <div className="pb"><div className="pbf" style={{width:`${status.progress}%`}}/></div>
              </div>
            )}
            {!status.running&&status.scraper_results&&(
              <div style={{marginTop:10,background:'var(--g50)',border:'1px solid var(--g200)',borderRadius:9,padding:'10px 12px'}}>
                <div style={{fontSize:10,fontWeight:700,color:'var(--g400)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:7}}>Scraper Results</div>
                {Object.entries(status.scraper_results).map(([name,count])=>(
                  <div key={name} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                    <span style={{fontSize:11,color:'var(--g600)'}}>{name}</span>
                    <span style={{fontSize:11,fontWeight:700,color:count>0?'var(--gr600)':'var(--rd500)',background:count>0?'var(--gr50)':'var(--rd50)',padding:'1px 7px',borderRadius:99}}>{count>0?`${count} jobs`:'0'}</span>
                  </div>
                ))}
              </div>
            )}
            <button onClick={()=>window.dispatchEvent(new CustomEvent('open-flashcards'))} style={{
              width:'100%',marginTop:8,padding:'10px 14px',
              background:'linear-gradient(135deg,#4338ca,#6366f1)',
              borderRadius:10,cursor:'pointer',
              display:'flex',alignItems:'center',gap:9,
              boxShadow:'0 2px 8px rgba(67,56,202,.3)',animation:'fadeIn .4s ease',
              border:'none',
            }}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
              </svg>
              <div style={{flex:1,textAlign:'left'}}>
                <div style={{fontSize:12,color:'#fff',fontWeight:700}}>Learn while Searchy works</div>
                <div style={{fontSize:10,color:'rgba(255,255,255,.65)',marginTop:1}}>55 skill flashcards · click to open</div>
              </div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" strokeWidth="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </div>
        )}
      </div>
      <div className="div"/>
      <div>
        <div className="rp-title">Email Results</div>
        <input className="inp" placeholder="your@email.com" value={email} onChange={e=>setEmail(e.target.value)} style={{marginBottom:8,fontSize:12,padding:'8px 10px'}}/>
        <button className="btn btn-s" onClick={sendDigest} disabled={sending} style={{width:'100%',fontSize:12,padding:'8px',marginBottom:6}}>
          {sending?<span className="spinner spinner-d"/>:'Send Digest'}
        </button>
        <button onClick={async()=>{
          const r=await api.post('/api/whatsapp-share',{});
          if(r.url){window.open(r.url,'_blank');}
          else showToast('No jobs to share yet','error');
        }} style={{width:'100%',padding:'8px',fontSize:12,fontWeight:600,background:'#22c55e',color:'#fff',border:'none',borderRadius:10,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6,fontFamily:'Inter'}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff" style={{flexShrink:0}}><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.119.553 4.107 1.523 5.832L.043 23.25l5.562-1.453A11.942 11.942 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.891 0-3.659-.505-5.186-1.388l-.371-.22-3.302.863.882-3.223-.242-.389A9.937 9.937 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
    Share on WhatsApp
        </button>
      </div>
      <div className="div"/>
      <div>
        <div className="rp-title">Daily Auto-Scan</div>
        <div style={{display:'flex',flexDirection:'column',gap:5}}>
          {['08:00 AM','12:00 PM','06:00 PM','11:00 PM'].map(t=>(
            <div key={t} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 9px',background:'var(--g50)',border:'1px solid var(--g200)',borderRadius:8}}>
              <div style={{width:6,height:6,borderRadius:'50%',background:'#22c55e',boxShadow:'0 0 4px #22c55e'}}/>
              <span style={{fontSize:11,color:'var(--g500)',fontWeight:500}}>{t}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

const ICONS={
  resume:<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="2" y="1" width="10" height="14" rx="1.5"/><line x1="5" y1="5" x2="9" y2="5"/><line x1="5" y1="8" x2="10" y2="8"/><line x1="5" y1="11" x2="8" y2="11"/></svg>,
  jobs:<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="1" y="5" width="14" height="10" rx="1.5"/><path d="M5 5V3.5A1.5 1.5 0 016.5 2h3A1.5 1.5 0 0111 3.5V5"/></svg>,
  star:<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><polygon points="8,1 10,6 15,6 11,9.5 12.5,15 8,12 3.5,15 5,9.5 1,6 6,6"/></svg>,

  deadlines:<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 4v4l3 2"/></svg>,
};

const DEMO_PROFILE = {
  name: "Rushikesh Kedar",
  email: "rushikesh@example.com",
  title: "Full Stack & AI Systems Engineer",
  college: "SPPU (Pune University)",
  current_course: "B.Tech Computer Engineering",
  year_of_study: "4",
  cgpa: "8.7",
  skills: {
    technical: [
      "Python", "FastAPI", "React", "Docker", "SQL", "Machine Learning",
      "Git", "REST APIs", "PostgreSQL", "Flask", "AsyncIO", "Pandas",

  certifications: ["Google Cloud Certified", "DeepLearning.AI Machine Learning Specialization"],
  experience_years: 1.5,
  parsed_at: new Date().toISOString()
};

function ThemeSwitcher({theme, onSelectTheme}){
  return(
    <div className="theme-toggle-group" title="Theme Selector (1-click)">
      <button
        type="button"
        className={`theme-pill ${theme==='classic'?'active':''}`}
        onClick={()=>onSelectTheme('classic')}
      >
        Classic
      </button>
      <button
        type="button"
        className={`theme-pill ${theme==='obsidian-dark'?'active':''}`}
        onClick={()=>onSelectTheme('obsidian-dark')}
      >
        🌙 Obsidian
      </button>
      <button
        type="button"
        className={`theme-pill ${theme==='porcelain-light'?'active':''}`}
        onClick={()=>onSelectTheme('porcelain-light')}
      >
        ☀️ Porcelain
      </button>
    </div>
  );
}

function App(){
  const [view,setView]=useState('hero');
  const [tab,setTab]=useState('resume');
  const [profile,setProfile]=useState(null);
  const [toast,setToast]=useState(null);
  const [showEmailPopup,setShowEmailPopup]=useState(false);
  const [appPipelineRunning,setAppPipelineRunning]=useState(false);
  const [popupEmail,setPopupEmail]=useState('');
  const [popupSent,setPopupSent]=useState(false);
  const [popupSending,setPopupSending]=useState(false);
  const [showFlashCards,setShowFlashCards]=useState(false);

  const [theme,setThemeState]=useState(()=>{
    try{
      return localStorage.getItem('jobsearchy_theme')||'obsidian-dark';
    }catch(e){
      return 'obsidian-dark';
    }
  });

  const changeTheme=(newTheme)=>{
    setThemeState(newTheme);
    try{
      localStorage.setItem('jobsearchy_theme',newTheme);
    }catch(e){}
    document.documentElement.setAttribute('data-theme',newTheme);
  };

  useEffect(()=>{
    document.documentElement.setAttribute('data-theme',theme);
  },[theme]);

  const showToast=(msg,type='info')=>setToast({msg,type,id:Date.now()});

  // Don't auto-load last person's profile — privacy
  useEffect(()=>{
    api.get('/api/pipeline-status').catch(()=>{});
    // Listen for pipeline done from PipelinePanel too
    const h=()=>{setTimeout(()=>setShowEmailPopup(true),1500);};
    window.addEventListener('pipeline-done',h);
    const hf=()=>setShowFlashCards(true);
    window.addEventListener('open-flashcards',hf);
    return()=>{window.removeEventListener('pipeline-done',h);window.removeEventListener('open-flashcards',hf);};
  },[]);

  const navItems=[
    {id:'resume',label:'Resume',icon:ICONS.resume},
    {id:'all',label:'All Jobs',icon:ICONS.jobs},
    {id:'top',label:'Top Matches',icon:ICONS.star},
    {id:'saved',label:'Saved',icon:ICONS.saved},
    {id:'analytics',label:'Analytics',icon:ICONS.analytics},
    {id:'tracker',label:'My Applications',icon:ICONS.tracker},
    {id:'career',label:'Career GPS',icon:ICONS.career},
    {id:'deadlines',label:'Hackathons',icon:ICONS.deadlines},
    {id:'gapanalysis',label:'Skill Gaps',icon:ICONS.gap},
  ];

  const showPanel=['all','top','saved','tracker','deadlines','gapanalysis'].includes(tab);
  const displayName=profile?.name||'Guest';
  const initial=displayName[0].toUpperCase();
  const institution=profile?.education?.[0]?.institution||(profile?'College':'');
  const displaySub=profile?`${institution} · Year ${profile.year_of_study||'?'}`:'Upload your resume';

  if(view==='hero'){
    return(
      <>
        <nav className="nav">
          <div className="logo" onClick={()=>setView('hero')}><em>Job</em>Searchy</div>
          <div style={{display:'flex',gap:10,alignItems:'center'}}>
            <ThemeSwitcher theme={theme} onSelectTheme={changeTheme}/>
            {profile ? (
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <div className="nav-pill"><div className="nav-av">{initial}</div>{displayName}</div>
                <button
                  type="button"
                  className="btn btn-s"
                  onClick={()=>{setProfile(null);showToast('Profile cleared','info');}}
                  style={{fontSize:11,padding:'4px 8px',borderRadius:999}}
                  title="Clear profile"
                >✕</button>
              </div>
            ) : (
              <button
                type="button"
                className="btn-demo-profile"
                onClick={()=>{
                  setProfile(DEMO_PROFILE);
                  showToast("⚡ Demo Profile loaded (Rushikesh Kedar)", "success");
                  setView('app');
                }}
                title="Load verified candidate profile"
              >
                ⚡ Demo Profile
              </button>
            )}
            <button className="btn btn-p" onClick={()=>setView('app')}>Open Dashboard<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:"inline-block",verticalAlign:"-2px",marginLeft:4}}><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
          </div>
        </nav>
        <Hero onStart={()=>setView('app')}/>
        {toast&&<Toast key={toast.id} msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
      </>
    );
  }

  return(
    <>
      <nav className="nav">
        <div className="logo" onClick={()=>setView('hero')}><em>Job</em>Searchy</div>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          <ThemeSwitcher theme={theme} onSelectTheme={changeTheme}/>
          {profile ? (
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <div className="nav-pill">
                <div className="nav-av">{initial}</div>
                <span style={{fontSize:13,fontWeight:500,color:'var(--g700)'}}>{profile.name}</span>
              </div>
              <button
                type="button"
                className="btn btn-s"
                onClick={()=>{setProfile(null);showToast('Profile cleared','info');}}
                style={{fontSize:11,padding:'4px 8px',borderRadius:999}}
                title="Clear profile"
              >✕</button>
            </div>
          ) : (
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <button
                type="button"
                className="btn-demo-profile"
                onClick={()=>{
                  setProfile(DEMO_PROFILE);
                  showToast("⚡ Demo Profile loaded (Rushikesh Kedar)", "success");
                }}
                title="Load verified candidate profile"
              >
                ⚡ Demo Profile
              </button>
              <button className="btn btn-p" onClick={()=>setTab('resume')} style={{fontSize:12,padding:'7px 14px'}}>Upload Resume<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:"inline-block",verticalAlign:"-2px",marginLeft:4}}><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
            </div>
          )}
        </div>
      </nav>
      <div className="app">
        <div className="sb">
          <div className="sb-lbl">Menu</div>
          {navItems.map(n=>(
            <div key={n.id} className={`nl${tab===n.id?' active':''}`} onClick={()=>setTab(n.id)}>
              {n.icon}<span>{n.label}</span>
            </div>
          ))}
          <div className="sb-footer">
            <div className="u-pill" onClick={()=>!profile&&setTab('resume')} style={{cursor:profile?'default':'pointer'}}>
              <div className="u-av" style={{background:profile?undefined:'var(--g200)',color:profile?undefined:'var(--g500)'}}>{ profile?profile.name[0].toUpperCase():'?'}</div>
              <div style={{flex:1,minWidth:0}}>
                <div className="u-name">{profile?profile.name:'No resume'}</div>
                <div className="u-sub">{profile?displaySub:'Click to upload'}</div>
              </div>
            </div>
          </div>
        </div>
        <div className="main">
          <div className="pg">
            {tab==='resume'&&<ResumeTab profile={profile} setProfile={setProfile} showToast={showToast}
              onGoToJobs={(state,msg)=>{
                if(state==="running"){setTab("all");setTimeout(()=>setShowFlashCards(true),800);}
                if(state==="done"){
                  setTab("top");
                  setShowFlashCards(false);
                  setTimeout(()=>setShowEmailPopup(true),1500);
                  showToast(msg||"✨ Showing your top matches!","success");
                }
              }}
            />}
            {tab==='all'&&<JobsTab showToast={showToast} mode="all"/>}
            {tab==='top'&&<JobsTab showToast={showToast} mode="top"/>}
            {tab==='saved'&&<JobsTab showToast={showToast} mode="saved"/>}
            {tab==='analytics'&&<AnalyticsTab/>}
            {tab==='tracker'&&<AppTrackerTab showToast={showToast}/>}
            {tab==='career'&&<CareerGPSTab profile={profile}/>}
            {tab==='deadlines'&&<DeadlinePage/>}
            {tab==='gapanalysis'&&<GapAnalysisPage profile={profile}/>}
          </div>
        </div>
        {showPanel&&<PipelinePanel showToast={showToast}
              profile={profile}
              onFindJobs={profile?async()=>{
                setAppPipelineRunning(true);
                setTab("all");
                setTimeout(()=>setShowFlashCards(true),800);
                const r=await api.post('/api/run-pipeline',{days:7});
                if(r.error){showToast(r.error,'error');setAppPipelineRunning(false);return;}
                showToast('Searching jobs...','info');
                const iv=setInterval(async()=>{
                  const s=await api.get('/api/pipeline-status');
                  if(s&&!s.running){
                    clearInterval(iv);setAppPipelineRunning(false);setTab("top");
                    setShowFlashCards(false);
                    window.dispatchEvent(new CustomEvent('pipeline-done'));
                    showToast(s.message,'success');
                    setTimeout(()=>setShowEmailPopup(true),1500);
                  }
                },1500);
              }:null}
              findRunning={appPipelineRunning}
            />}
      </div>
      {toast&&<Toast key={toast.id} msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
      <SkillFlashCards skills={profile?.skills?.technical||[]} visible={showFlashCards} onDismiss={()=>setShowFlashCards(false)}/>
      {/* Email notification popup */}
      {showEmailPopup&&(
        <div style={{position:'fixed',inset:0,background:'rgba(15,23,42,0.65)',backdropFilter:'blur(4px)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',animation:'fadeIn .2s ease'}}>
          <div style={{background:'var(--w)',border:'1px solid var(--g200)',borderRadius:20,padding:'32px',width:420,boxShadow:'var(--sh-xl)',position:'relative',animation:'fadeUp .3s cubic-bezier(.16,1,.3,1)'}}>
            <button onClick={()=>{setShowEmailPopup(false);setTab('top');}} style={{position:'absolute',top:14,right:14,background:'var(--g100)',border:'none',borderRadius:'50%',width:28,height:28,cursor:'pointer',fontSize:14,color:'var(--g500)',display:'flex',alignItems:'center',justifyContent:'center'}}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:"inline-block",verticalAlign:"-2px"}}><path d="M18 6L6 18M6 6l12 12"/></svg></button>
            {popupSent?(
              <div style={{textAlign:'center',padding:'16px 0'}}>
                
                <div style={{fontFamily:'Bricolage Grotesque',fontSize:20,fontWeight:800,color:'var(--g900)',marginBottom:8}}>Email sent!</div>
                <div style={{fontSize:13,color:'var(--g500)',marginBottom:20}}>Check your inbox for your top job matches</div>
                <button onClick={()=>{setShowEmailPopup(false);setPopupSent(false);setTab('top');}} style={{background:'var(--i600)',color:'#fff',border:'none',borderRadius:9,padding:'10px 24px',fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:'DM Sans'}}>Done</button>
              </div>
            ):(
              <>
                <div style={{textAlign:'center',marginBottom:20}}>
                  
                  <div style={{fontFamily:'Bricolage Grotesque',fontSize:20,fontWeight:800,color:'var(--g900)',marginBottom:6}}>Get your matches by email!</div>
                  <div style={{fontSize:13,color:'var(--g500)'}}>We found new jobs matching your profile. Want them in your inbox?</div>
                </div>
                {profile?.email&&(
                  <button onClick={()=>setPopupEmail(profile.email)} style={{
                    width:'100%',marginBottom:8,padding:'9px 14px',
                    background:'var(--i50)',border:'1.5px solid var(--i200)',borderRadius:9,
                    fontSize:12,color:'var(--i700)',fontWeight:600,cursor:'pointer',
                    display:'flex',alignItems:'center',gap:8,fontFamily:'DM Sans',
                    textAlign:'left',
                  }}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    <div>
                      <div style={{fontSize:11,color:'var(--g400)',marginBottom:1}}>Use email from resume</div>
                      <div style={{fontWeight:700}}>{profile.email}</div>
                    </div>
                    {popupEmail===profile.email&&<span style={{marginLeft:'auto',color:'var(--i600)'}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" style={{display:"inline-block",verticalAlign:"-2px"}}><polyline points="20 6 9 17 4 12"/></svg></span>}
                  </button>
                )}
                <input
                  className="inp" placeholder="or enter another email..." value={popupEmail}
                  onChange={e=>setPopupEmail(e.target.value)}
                  style={{marginBottom:10,fontSize:13}}
                  onKeyDown={async e=>{
                    if(e.key==='Enter'&&popupEmail){
                      const r=await api.post('/api/send-digest',{email:popupEmail});
                      if(r&&r.success) setPopupSent(true);
                      else showToast(r?.error||'Email failed','error');
                    }
                  }}
                />
                <div style={{display:'flex',gap:8}}>
                  <button onClick={async()=>{
                    if(!popupEmail){showToast('Enter your email','error');return;}
                    if(popupSending)return;
                    setPopupSending(true);
                    await api.post('/api/send-digest',{email:popupEmail});
                    setPopupSending(false);
                    setPopupSent(true);
                  }} disabled={popupSending} style={{flex:1,background:popupSending?'#6366f1':'var(--i600)',color:'#fff',border:'none',borderRadius:9,padding:'11px',fontSize:14,fontWeight:600,cursor:popupSending?'not-allowed':'pointer',fontFamily:'Bricolage Grotesque',display:'flex',alignItems:'center',justifyContent:'center',gap:8,opacity:popupSending?0.8:1}}>
                    {popupSending?<><span className="spinner"/>Sending...</>:'Send me the jobs'}
                  </button>
                  <button onClick={()=>{setShowEmailPopup(false);setTab('top');}} style={{background:'var(--g100)',color:'var(--g600)',border:'none',borderRadius:9,padding:'11px 16px',fontSize:13,cursor:'pointer',fontFamily:'DM Sans'}}>
                    Not now
                  </button>
                </div>
              </>
            )}
          </div>
          
        </div>
      )}
      <JobyChatbot profile={profile} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
